name: Build Acer HAOS kernel module

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-acer-module.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev dwarves curl xz-utils kmod

      - name: Download Linux and HAOS config
        env:
          KERNEL_VERSION: '6.18.39'
          HAOS_VERSION: '18.2'
        run: |
          set -euxo pipefail
          curl -fL --retry 3 "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KERNEL_VERSION}.tar.xz" -o linux.tar.xz
          tar -xJf linux.tar.xz
          mkdir -p haos-config
          base="https://raw.githubusercontent.com/home-assistant/operating-system/${HAOS_VERSION}"
          curl -fL --retry 3 "$base/buildroot-external/kernel/v6.18.y/haos.config" -o haos-config/01-haos.config
          curl -fL --retry 3 "$base/buildroot-external/kernel/v6.18.y/docker.config" -o haos-config/02-docker.config
          curl -fL --retry 3 "$base/buildroot-external/kernel/v6.18.y/device-support.config" -o haos-config/03-device-support.config
          curl -fL --retry 3 "$base/buildroot-external/kernel/v6.18.y/device-support-wireless.config" -o haos-config/04-device-support-wireless.config
          curl -fL --retry 3 "$base/buildroot-external/kernel/v6.18.y/device-support-wireless-pci.config" -o haos-config/05-device-support-wireless-pci.config
          curl -fL --retry 3 "$base/buildroot-external/kernel/v6.18.y/device-support-pci.config" -o haos-config/06-device-support-pci.config
          curl -fL --retry 3 "$base/buildroot-external/board/pc/generic-x86-64/kernel.config" -o haos-config/07-generic-x86-64.config

      - name: Prepare matching HAOS kernel tree
        env:
          KERNEL_VERSION: '6.18.39'
        run: |
          set -euxo pipefail
          cd "linux-${KERNEL_VERSION}"
          make x86_64_defconfig
          scripts/kconfig/merge_config.sh -m .config ../haos-config/*.config
          scripts/config --set-str LOCALVERSION '-haos'
          make olddefconfig
          grep -Fx 'CONFIG_LOCALVERSION="-haos"' .config
          make -j"$(nproc)" modules_prepare
          test "$(make -s kernelrelease)" = "${KERNEL_VERSION}-haos"
          if grep -q '^CONFIG_MODVERSIONS=y' .config; then
            echo 'CONFIG_MODVERSIONS is enabled; a full kernel build would be required.' >&2
            exit 1
          fi

      - name: Build acer-wmi-battery module with HAOS compatibility fallback
        env:
          KERNEL_VERSION: '6.18.39'
          ACER_WMI_COMMIT: '08d16e64a3db4a94717c5ed6c93d1b3857f96916'
        run: |
          set -euxo pipefail
          mkdir -p acer-module
          curl -fL --retry 3 "https://raw.githubusercontent.com/frederik-h/acer-wmi-battery/${ACER_WMI_COMMIT}/acer-wmi-battery.c" -o acer-module/acer-wmi-battery.c

          python3 - <<'PY'
          from pathlib import Path
          p = Path('acer-module/acer-wmi-battery.c')
          s = p.read_text()

          old = '''static short enable_health_mode = -1;\n\nmodule_param(enable_health_mode, short, S_IRUSR | S_IWUSR | S_IRGRP | S_IWGRP);'''
          new = '''static short enable_health_mode = -1;\nstatic bool set_only;\nstatic bool wmi_driver_registered;\n\nmodule_param(enable_health_mode, short, S_IRUSR | S_IWUSR | S_IRGRP | S_IWGRP);\nmodule_param(set_only, bool, S_IRUSR | S_IWUSR | S_IRGRP | S_IWGRP);\nMODULE_PARM_DESC(set_only,\n\t\"Apply enable_health_mode and skip the firmware status-query/driver registration. Useful on older Acer firmware where SET works but GET status is incompatible.\");'''
          if old not in s:
              raise SystemExit('parameter patch anchor not found')
          s = s.replace(old, new, 1)

          old = '''\tif (enable_health_mode >= 0) {\n\t\tacpi_status status;\n\t\tstatus = set_battery_health_control(HEALTH_MODE,\n\t\t\t\t\t\t    enable_health_mode);\n\n\t\tif (ACPI_FAILURE(status))\n\t\t\treturn -EIO;\n\t}\n\n\tif (ACPI_FAILURE(init_state()))\n\t\treturn -EIO;\n\n\treturn wmi_driver_register(&acer_wmi_battery_driver);'''
          new = '''\tif (enable_health_mode >= 0) {\n\t\tacpi_status status;\n\t\tstatus = set_battery_health_control(HEALTH_MODE,\n\t\t\t\t\t\t    enable_health_mode);\n\n\t\tif (ACPI_FAILURE(status))\n\t\t\treturn -EIO;\n\n\t\tif (set_only) {\n\t\t\tpr_info(\"health-mode SET accepted by firmware; status query skipped\\n\");\n\t\t\treturn 0;\n\t\t}\n\t}\n\n\tif (ACPI_FAILURE(init_state()))\n\t\treturn -EIO;\n\n\t{\n\t\tint ret = wmi_driver_register(&acer_wmi_battery_driver);\n\t\tif (!ret)\n\t\t\twmi_driver_registered = true;\n\t\treturn ret;\n\t}'''
          if old not in s:
              raise SystemExit('init patch anchor not found')
          s = s.replace(old, new, 1)

          old = '''static void __exit acer_battery_exit(void)\n{\n\twmi_driver_unregister(&acer_wmi_battery_driver);\n}'''
          new = '''static void __exit acer_battery_exit(void)\n{\n\tif (wmi_driver_registered)\n\t\twmi_driver_unregister(&acer_wmi_battery_driver);\n}'''
          if old not in s:
              raise SystemExit('exit patch anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          grep -n 'set_only' acer-module/acer-wmi-battery.c
          printf '%s\n' 'obj-m += acer-wmi-battery.o' > acer-module/Makefile
          make -C "linux-${KERNEL_VERSION}" M="$PWD/acer-module" KBUILD_MODPOST_WARN=1 modules
          test -s acer-module/acer-wmi-battery.ko
          modinfo acer-module/acer-wmi-battery.ko
          test "$(modinfo -F vermagic acer-module/acer-wmi-battery.ko | awk '{print $1}')" = "${KERNEL_VERSION}-haos"
          modinfo -p acer-module/acer-wmi-battery.ko | grep -q '^set_only:'

      - name: Commit prebuilt module
        env:
          KERNEL_VERSION: '6.18.39'
        run: |
          set -euxo pipefail
          dest="acer_battery_80/modules/${KERNEL_VERSION}-haos"
          mkdir -p "$dest"
          cp acer-module/acer-wmi-battery.ko "$dest/acer-wmi-battery.ko"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dest/acer-wmi-battery.ko"
          if git diff --cached --quiet; then
            echo 'Module is unchanged.'
            exit 0
          fi
          git commit -m "Prebuild Acer battery module with set-only fallback"
          git push
