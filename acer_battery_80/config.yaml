name: "Acer Battery 80%"
version: "0.2.0"
slug: "acer_battery_80"
description: "Enable Acer firmware battery health mode (~80% charge limit) on HAOS and publish battery level to Home Assistant"
url: "https://github.com/jpark40/ha-media-frame-addon"
arch:
  - amd64
machine:
  - generic-x86-64
startup: services
boot: auto
init: false
kernel_modules: true
homeassistant_api: true
apparmor: false
options:
  health_mode: true
schema:
  health_mode: bool
