name: "Acer Battery 80%"
version: "0.1.3"
slug: "acer_battery_80"
description: "Enable Acer firmware battery health mode (~80% charge limit) on HAOS"
url: "https://github.com/jpark40/ha-media-frame-addon"
arch:
  - amd64
machine:
  - generic-x86-64
startup: once
boot: auto
init: false
kernel_modules: true
apparmor: false
options:
  health_mode: true
schema:
  health_mode: bool
