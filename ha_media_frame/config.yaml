name: "HA Media Frame"
version: "1.2.5"
slug: "ha_media_frame"
description: "DAKboard-style photo and muted-video screen for HA-mounted media"
url: "https://github.com/jpark40/ha-media-frame-addon"
stage: stable
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Media frame and settings web interface"
webui: "http://[HOST]:[PORT:8099]/settings"
watchdog: "http://[HOST]:[PORT:8099]/health"
map:
  - type: media
    read_only: true
